name: Build ARC Volume APK

on:
  push:
    branches: [arc-volume-build]
    paths:
      - 'ArcVolumeOverlay/**'
      - '.github/workflows/arc-volume-build.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: arc-volume-stable-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: arc-volume-debug-keystore-v2
          fail-on-cache-miss: true

      - name: Verify stable signing key
        run: test -s "$HOME/.android/debug.keystore"

      - name: Build debug APK
        env:
          ARC_VOLUME_KEYSTORE: /home/runner/.android/debug.keystore
        run: gradle -p ArcVolumeOverlay assembleDebug --stacktrace

      - name: Rename APK
        run: cp ArcVolumeOverlay/app/build/outputs/apk/debug/app-debug.apk ArcVolume.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcVolume-APK
          path: ArcVolume.apk
          retention-days: 7
