name: Build ARC Volume APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/arc-volume-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARC Volume source branch
        uses: actions/checkout@v4
        with:
          ref: arc-volume-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache stable ARC Volume debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arc-volume-debug-keystore-v1

      - name: Build debug APK
        run: gradle -p ArcVolumeOverlay assembleDebug --stacktrace

      - name: Rename APK
        run: cp ArcVolumeOverlay/app/build/outputs/apk/debug/app-debug.apk ArcVolume.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcVolume-APK
          path: ArcVolume.apk
          retention-days: 7

